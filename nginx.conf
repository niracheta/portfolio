server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Cloudflare terminates TLS; this only sets headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  error_page 404 /404.html;
}
